# 对象存储使用并列目录 ProjectMinio（独占宿主机 9000/9001），本 compose 不再包含 minio 服务。
services:
  app:
    build: .
    container_name: music-mvp-app
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      - ./import:/import
      # 挂载应用代码，改 HTML/CSS/JS 后重启容器即可生效，无需每次 rebuild
      - ./app:/app/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
