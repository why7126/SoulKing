name: soulking

services:
  soulking-app:
    image: ${SOULKING_APP_IMAGE_REPOSITORY:-soulking-app}:${SOULKING_IMAGE_TAG:-v0.0.1}
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: soulking-app
    env_file:
      - ${SOULKING_DEPLOY_ENV_FILE:?Set SOULKING_DEPLOY_ENV_FILE to production env}
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DATABASE_URL: ${DATABASE_URL:?Set production SQLite DATABASE_URL}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:?Set external object storage endpoint}
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:?Set public object storage endpoint}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set object storage access key}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set object storage secret key}
      S3_REGION_NAME: ${S3_REGION_NAME:-us-east-1}
      S3_BUCKET_MUSIC: ${S3_BUCKET_MUSIC:?Set existing bucket}
      S3_SECURE: ${S3_SECURE:-true}
    ports:
      - "${HOST_PORT_APP:-8000}:8000"
    volumes:
      - ../../data:/data
      - ../../import:/import
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - soulking

  soulking-docs-site:
    profiles:
      - docs-site
    image: ${MINTLIFY_NODE_IMAGE:-node:22-alpine}
    container_name: soulking-docs-site
    working_dir: /workspace/mintlify
    volumes:
      - ../../mintlify:/workspace/mintlify:ro
      - ../../deploy/scripts/docs-site-static-server.mjs:/workspace/docs-site-static-server.mjs:ro
    ports:
      - "${HOST_PORT_MINTLIFY_DOCS:-3001}:3000"
    command: node /workspace/docs-site-static-server.mjs
    networks:
      - soulking

networks:
  soulking:
    driver: bridge
